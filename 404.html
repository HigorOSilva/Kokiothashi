<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Kokiothashi</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  .erro { min-height: 100dvh; display: grid; place-content: center; text-align: center;
          padding: var(--lado); gap: 1.4rem; }
  .erro__c { font-family: var(--mono); font-size: var(--t-mi); letter-spacing: .22em;
             text-transform: uppercase; color: var(--azul); }
  .erro__k { width: 54px; margin: 0 auto 1rem; color: var(--tinta); }
  .erro p { color: var(--grafite); max-width: 34rem; margin-inline: auto; }
  .erro .btn { justify-self: center; }
</style>
</head>
<body>
<main class="erro">
  <svg class="erro__k" viewBox="0 0 177 200" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 39.5 L4.5 12 L4.5 188 L32 160.5"/>
      <path d="M32 84 L111.5 4.5 L172.5 4.5 L77 100 L172.5 195.5 L111.5 195.5 L32 116"/>
    </g>
  </svg>
  <p class="erro__c">Erro 404</p>
  <h1 class="d2">Esta página não existe.</h1>
  <p>O endereço pode ter mudado ou o link estar incompleto. A página inicial tem tudo
     o que você procura.</p>
  <a class="btn btn--cheio btn--lg" href="/">Voltar para o início</a>
</main>
</body>
</html>
